<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Анализ текста</title>

    <style>
      body {
        font-family: Arial;
        background: linear-gradient(135deg, #0f3d0f, #1f6f1f);
        color: #fff;
        text-align: center;
      }

      .container {
        width: 500px;
        margin: 60px auto;
        padding: 25px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      }

      textarea {
        width: 100%;
        height: 150px;
        border-radius: 10px;
        border: none;
        padding: 10px;
        font-size: 15px;
      }

      button {
        margin-top: 15px;
        padding: 12px 25px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #b6ff00, #6aff00);
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: scale(1.05);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Введите текст</h2>

      <form action="result.php" method="post">
        <textarea name="data"></textarea><br />
        <button type="submit">Анализировать</button>
      </form>
    </div>
  </body>
</html>
